    <script>
      (function () {
        var MIN = 1500 /* en az yükleme süresi (ms) */,
          H = document.documentElement,
          P = document.getElementById("pdx"),
          mq = matchMedia("(orientation:portrait) and (max-width:900px)"),
          ok = document.readyState === "complete",
          tm = false;
        H.classList.add("pdx-l");
        function go() {
          if (!ok || !tm || P.classList.contains("pdx-open")) return;
          var m = mq.matches;
          P.classList.add("pdx-open", m ? "pdx-mob" : "pdx-out");
          H.classList.remove("pdx-l");

          setTimeout(
            function () {
              if (m) H.classList.add("pdx-r");
              P.remove();
            },
            m ? 1500 : 1900,
          );
        }
        /* sayfanın en üstüne / en altına yaklaştıkça Pokédex parçası çıkar (T = mesafe, px) */
        function upd() {
          var y = scrollY,
            mx = H.scrollHeight - innerHeight,
            T = 120;
          H.style.setProperty("--rt", Math.max(0, Math.min(1, 1 - y / T)));
          H.style.setProperty("--rb", Math.max(0, Math.min(1, 1 - (mx - y) / T)));
        }
        var tk = 0;
        function sc() {
          if (tk) return;
          tk = requestAnimationFrame(function () {
            tk = 0;
            if (H.classList.contains("pdx-c")) upd();
          });
        }

        setTimeout(function () {
          tm = true;
          go();
        }, MIN);
        setTimeout(function () {
          ok = true;
          tm = true;
          go();
        }, 8000); /* yedek: load gelmezse yine de aç */
        if (!ok)
          addEventListener("load", function () {
            ok = true;
            go();
          });
      })();
    </script>
